name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  call-reusable-workflow:
    uses: ./.github/workflows/reusable-node-quality.yml

github-pages:
  name: Deploy to GitHub Pages
  needs: quality
  uses: ./.github/workflows/deploy-pages.yml
  with:
    node-version: "24"
  permissions:
    contents: read
    pages: write
    id-token: write
